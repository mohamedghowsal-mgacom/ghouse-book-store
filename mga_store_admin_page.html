<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #1e272e; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .admin-box { background: #2f3640; padding: 30px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #fbc531; margin-bottom: 20px; text-align: center; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #dcdde1; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: none; background: #353b48; color: white; font-size: 14px; }
        button { background: #3ecf8e; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #34b27b; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="admin-box">
        <h2>⚡ Supabase Book Upload</h2>
        
        <label>புத்தகத்தின் தலைப்பு (Title)</label>
        <input type="text" id="bookTitle" placeholder="எ.கா: ரமலான் பயான்">

        <label>பிரிவு (Category)</label>
        <select id="bookCategory">
            <option value="bayan">Bayaan (பயான்)</option>
            <option value="kavithai">Kavithai (கவிதை)</option>
            <option value="kathai">Kathai (கதை)</option>
            <option value="tamil">Tamil Books (தமிழ்)</option>
            <option value="kids">Kids Books (குழந்தைகள்)</option>
            <option value="school">School Books (பள்ளி)</option>
        </select>

        <label>PDF / Google Drive Link</label>
        <input type="text" id="bookFile" placeholder="Drive Link அல்லது PDF URL">

        <button onclick="uploadBook()">Save to Supabase</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://vsapcaxdubtevuwhtjzt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzYXBjYXhkdWJ0ZXZ1d2h0anp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODA1NjEsImV4cCI6MjEwMTc1NjU2MX0.Se3wswPII6i8AnBN2WpJK3Fm5ScdKoN8zqcDmAXebII';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.uploadBook = async function() {
            let title = document.getElementById("bookTitle").value;
            let category = document.getElementById("bookCategory").value;
            let file = document.getElementById("bookFile").value;

            if(!title || !file) {
                alert("அனைத்து கட்டங்களையும் நிரப்பவும்!");
                return;
            }

            const { data, error } = await _supabase
                .from('books')
                .insert([{ title: title, category: category, file: file }]);

            if (error) {
                alert("பிழை ஏற்பட்டது: " + error.message);
            } else {
                alert("புத்தகம் வெற்றிகரமாக Supabase-ல் சேமிக்கப்பட்டது!");
                document.getElementById("bookTitle").value = "";
                document.getElementById("bookFile").value = "";
            }
        }
    </script>
</body>
</html>
