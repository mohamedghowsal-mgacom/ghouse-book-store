<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghowse Book Store</title>
    <style>
        /* வலைத்தளத்தின் பின்னணி மற்றும் அடிப்படை அமைப்பு */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f2f5; 
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        /* வெள்ளை நிற பெட்டி அமைப்பு */
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 400px;
        }
        /* தலைப்பு எழுத்துக்கள் */
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 28px; }
        p.subtitle { color: #7f8c8d; font-size: 15px; margin-top: 0; margin-bottom: 25px; }
        
        /* 🛍️ Books பார்க்கவும் - தலைப்பு அமைப்பு */
        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px dashed #e67e22;
            display: inline-block;
        }

        /* புத்தகங்களின் பட்டியல் அமைப்பு */
        .book-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* சாதாரண பட்டன்கள் */
        .book-menu > a {
            text-decoration: none;
            background-color: #2980b9;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s, transform 0.2s;
        }
        .book-menu > a:hover {
            background-color: #1a5276;
            transform: translateY(-3px);
        }

        /* Select / Dropdown பட்டன் (Islamic Books-க்கு மட்டும்) */
        .custom-select {
            background-color: #2980b9;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
            overflow: hidden;
            text-align: left;
        }
        .custom-select summary {
            padding: 15px 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            list-style: none; /* அம்பு குறியீட்டை மறைக்க */
            outline: none;
        }
        .custom-select summary::-webkit-details-marker {
            display: none;
        }
        .custom-select[open] summary, .custom-select summary:hover {
            background-color: #1a5276;
        }
        
        /* Dropdown உள்ளே இருக்கும் ஆப்ஷன்கள் (Bayaan, Kavithai...) */
        .select-options {
            background-color: #ecf0f1;
            display: flex;
            flex-direction: column;
        }
        .select-options a {
            text-decoration: none;
            color: #2c3e50;
            padding: 12px 20px;
            border-bottom: 1px solid #bdc3c7;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .select-options a:last-child {
            border-bottom: none;
        }
        .select-options a:hover {
            background-color: #d0d3d4;
            padding-left: 25px; /* Hover செய்யும்போது லேசாக நகரும் எஃபெக்ட் */
        }

        /* தொடர்பு விவரங்கள் */
        .contact-info {
            margin-top: 35px;
            font-size: 15px;
            color: #555;
            border-top: 1px solid #ddd;
            padding-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- கடையின் பெயர் -->
        <h1>Ghowse Book Store</h1>
        <p class="subtitle">சிறந்த புத்தகங்கள், குறைவான விலையில்!</p>
        
        <!-- புத்தகங்கள் தலைப்பு -->
        <div class="section-title">🛍️ Books பார்க்கவும்</div>
        
        <!-- வரிசையான புத்தகங்களின் பட்டன்கள் -->
        <div class="book-menu">
            
            <!-- Select Button for Islamic Books -->
            <details class="custom-select">
                <summary>📚 Islamic Books ▾</summary>
                <div class="select-options">
                    <a href="#">🎙️ Bayaan (பயான்)</a>
                    <a href="#">✍️ Kavithai (கவிதை)</a>
                    <a href="#">📖 Kathai (கதை)</a>
                </div>
            </details>

            <a href="#">📘 Tamil Books</a>
            <a href="#">👶 Kids Books</a>
            <a href="#">📕 School Books</a>
        </div>

        <!-- கடை முகவரி மற்றும் தொடர்புக்கு -->
        <div class="contact-info">
            <b>தொடர்புக்கு:</b><br>
            📞 +91 9159345783 <br>
            ✉️ ghowsebooks@email.com
        </div>
    </div>
</body>
</html>
