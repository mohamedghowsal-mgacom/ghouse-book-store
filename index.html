<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghowse Book Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Mukta+Malar:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', 'Mukta Malar', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #ffffff; padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); width: 100%; max-width: 420px; position: relative; overflow: hidden; }
        .header { text-align: center; margin-bottom: 30px; }
        
        /* ரகசிய லிங்க் அமைப்பு - கையை வைத்தால் பட்டன் என்று தெரியாதபடி cursor: default கொடுக்கப்பட்டுள்ளது */
        .secret-link { text-decoration: none; display: inline-block; cursor: default; }
        .store-logo { font-size: 40px; margin-bottom: 10px; transition: transform 0.3s; }
        .secret-link:active .store-logo { transform: scale(0.9); }
        
        h1 { color: #1e272e; font-size: 26px; font-weight: 700; margin-bottom: 5px; letter-spacing: 0.5px; }
        p.subtitle { color: #808e9b; font-size: 14px; }
        .section-title { font-size: 16px; font-weight: 700; color: #485460; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; }
        .section-title::after { content: ""; flex: 1; height: 2px; background: #d2dae2; margin-left: 10px; border-radius: 5px; }
        .menu-list { display: flex; flex-direction: column; gap: 12px; }
        .menu-list > a, details > summary { background: #ffffff; color: #1e272e; padding: 16px 20px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; border: 2px solid #ecf0f1; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .menu-icon { font-size: 20px; margin-right: 15px; }
        .menu-list > a:hover, details[open] > summary, details > summary:hover { border-color: #0fb9b1; background: #f0fbfb; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(15, 185, 177, 0.15); }
        details { overflow: hidden; }
        summary { list-style: none; outline: none; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: "▼"; position: absolute; right: 20px; font-size: 12px; color: #808e9b; transition: transform 0.3s; }
        details[open] summary::after { transform: rotate(180deg); color: #0fb9b1; }
        .dropdown-content { background: #f8f9fa; margin: 5px 0 10px 0; border-radius: 10px; border: 1px solid #ecf0f1; overflow: hidden; }
        .dropdown-content a { color: #485460; padding: 14px 20px 14px 50px; font-size: 15px; font-weight: 600; text-decoration: none; display: block; border-bottom: 1px solid #ecf0f1; transition: 0.2s; }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background: #e1f5fe; color: #0984e3; padding-left: 55px; }
        .footer { margin-top: 30px; padding-top: 20px; border-top: 2px dashed #ecf0f1; text-align: center; }
        .contact-btn { background: #2bcbba; color: white; padding: 12px 20px; border-radius: 30px; text-decoration: none; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(43, 203, 186, 0.3); transition: 0.3s; }
        .contact-btn:hover { background: #0fb9b1; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <!-- இந்த லோகோவை க்ளிக் செய்தால் Admin பக்கம் (dashboard.html) திறக்கும் -->
            <a href="mga_store_admin_page.html" class="secret-link" title="Click here for Admin">
                <div class="store-logo">📖</div>
            </a>
            <h1>Ghowse Book Store</h1>
            <p class="subtitle">அறிவின் தேடல் தொடங்கும் இடம்</p>
        </div>
        
        <div class="section-title">Categories</div>
        
        <div class="menu-list">
            <details>
                <summary><span class="menu-icon">🕌</span> Islamic Books</summary>
                <div class="dropdown-content">
                    <a href="bayan.html">🎙️ பயான் (Bayaan)</a>
                    <a href="kavithai.html">✍️ கவிதை (Kavithai)</a>
                    <a href="kathai.html">📖 கதை (Kathai)</a>
                </div>
            </details>
            <a href="tamil-books.html"><span class="menu-icon">📘</span> Tamil Books</a>
            <a href="kids-books.html"><span class="menu-icon">👶</span> Kids Books</a>
            <a href="school-books.html"><span class="menu-icon">🎒</span> School Books</a>
        </div>

        <div class="footer">
            <a href="tel:+919159345783" class="contact-btn">📞 Call Us Now</a>
            <p style="margin-top: 15px; font-size: 12px; color: #a4b0be;">ghowsebooks@email.com</p>
        </div>

    </div>

</body>
</html>
