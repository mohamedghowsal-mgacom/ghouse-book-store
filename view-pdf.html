<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #ffffff; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; height: 90vh; box-shadow: 0 15px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px dashed #ecf0f1; padding-bottom: 10px; }
        .back-btn { text-decoration: none; color: #808e9b; font-weight: 600; font-size: 14px; cursor: pointer; }
        .back-btn:hover { color: #2c3e50; }
        
        h2 { color: #1e272e; font-size: 18px; text-align: center; flex-grow: 1; margin: 0 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        
        iframe { flex-grow: 1; width: 100%; border: 2px solid #ecf0f1; border-radius: 12px; background: #f8f9fa; }
        
        .download-btn { background: #3ecf8e; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; display: block; transition: 0.3s; font-size: 15px; }
        .download-btn:hover { background: #34b27b; }
        
        .error-msg { text-align: center; color: #e74c3c; margin-top: 50px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <!-- வந்த பக்கத்துக்கே திரும்பச் செல்லும் பட்டன் -->
            <a onclick="history.back()" class="back-btn">← Back</a>
            <h2 id="bookTitle">Loading...</h2>
            <div style="width: 50px;"></div> <!-- லேஅவுட் சென்டராக இருக்க ஒரு சிறிய இடைவெளி -->
        </div>
        
        <p id="errorMsg" class="error-msg">புத்தகம் கிடைக்கவில்லை அல்லது லிங்க் தவறானது!</p>
        
        <iframe id="pdfViewer" src=""></iframe>
        
        <a id="downloadBtn" href="#" target="_blank" class="download-btn">Download / Open in New Tab</a>
    </div>

    <script>
        // URL-ல் இருந்து Title மற்றும் File லிங்கை எடுக்கும் கோட்
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title');
        let fileUrl = urlParams.get('file');

        if (title && fileUrl) {
            document.getElementById('bookTitle').innerText = title;
            document.getElementById('downloadBtn').href = fileUrl;

            // Google Drive லிங்காக இருந்தால், அதை Embed செய்வதற்கு ஏற்றவாறு (Preview) மாற்றுதல்
            if (fileUrl.includes('drive.google.com/file/d/')) {
                const match = fileUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    fileUrl = `https://drive.google.com/file/d/${match[1]}/preview`;
                }
            }

            // PDF அல்லது Drive லிங்கை iframe-ல் செட் செய்தல்
            document.getElementById('pdfViewer').src = fileUrl;
        } else {
            // Title அல்லது File லிங்க் இல்லை என்றால் பிழையை காட்டுதல்
            document.getElementById('bookTitle').innerText = "பிழை!";
            document.getElementById('pdfViewer').style.display = "none";
            document.getElementById('downloadBtn').style.display = "none";
            document.getElementById('errorMsg').style.display = "block";
        }
    </script>
</body>
</html>
